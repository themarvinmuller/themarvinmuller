<!doctype html>
<html lang="pt-BR" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Oscar MarTech · QR Code</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#04241a">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@700;800&family=Inter:wght@400;600;700&family=JetBrains+Mono:wght@600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/assets/style.css">
<style>
  body {
    min-height: 100vh; margin: 0; display: grid; place-items: center; padding: 24px 16px;
    background: #04241a;
    background-image:
      radial-gradient(ellipse 55% 60% at 50% 45%, rgba(0,166,81,.30), transparent 70%),
      linear-gradient(rgba(255,255,255,.04) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255,255,255,.04) 1px, transparent 1px);
    background-size: auto, 32px 32px, 32px 32px;
    color: #f2fbf5; text-align: center;
  }
  .wrapq { display: flex; flex-direction: column; align-items: center; gap: 2.2vh; }
  .eyebrow { color: #c4d600; font-size: clamp(12px, 1.6vh, 18px); }
  h1 { font-size: clamp(32px, 6.5vh, 76px); }
  h1 .hl { color: #c4d600; }
  .qr { background: #fff; border-radius: 24px; padding: clamp(16px, 2.6vh, 32px);
    box-shadow: 0 0 0 6px #00a651, 0 20px 80px rgba(0,166,81,.35); }
  .qr img { display: block; width: min(56vh, 80vw); height: auto; image-rendering: pixelated; }
  .link { font: 600 clamp(16px, 3vh, 34px) var(--mono); color: #fff; }
  .hint { color: #9cc0ae; font-size: clamp(14px, 2vh, 22px); margin: 0; }
</style>
</head>
<body>
  <main class="wrapq">
    <div class="eyebrow">MarTech · Fim de ano 2026 · Votação aberta</div>
    <h1>Aponte a câmera e <span class="hl">vote</span></h1>
    <div class="qr"><img src="/assets/qrcode.svg" alt="QR code para oscar-alelo.vercel.app"></div>
    <div class="link">oscar-alelo.vercel.app</div>
    <p class="hint">Escolha seu nome e indique uma pessoa por categoria 🏆</p>
  </main>
</body>
</html>
